# /etc/nginx/sites-available/spread → ссылка в sites-enabled.
# http по адресу ВМ. Для https (нужен браузеру для копирования снимка графика)
# см. «HTTPS» в deploy/README.md.
server {
    listen 80;
    server_name _;

    client_max_body_size 5m;
    gzip on;
    gzip_types application/json text/css application/javascript;

    location /static/ {
        alias /opt/spread_terminal/staticfiles/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
